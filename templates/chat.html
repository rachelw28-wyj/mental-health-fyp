<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;

        }

        .sidebar {

        .sidebar-nav {

        .nav-item {

        }

            padding: 20px;
            border-top: 1px solid #e2e8f0;
        }

        .logout-btn {
            width: 100%;
            padding: 10px;
            background: white;
            border: 1px solid #ef4444;
            color: #ef4444;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .logout-btn:hover {
            background: #fef2f2;
        }

        /* Chat */
        .main {
            /* flex: 1;
            display: flex;
            flex-direction: column; */
            
            flex: 1;
            /* padding: 30px; */
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #2563eb;
            color: white;
            padding: 4px;
            text-align: center;            
            /* margin-bottom: 30px; */
            /* background: #2563eb;
            font-size: 28px; */
            /* padding: 10px;
            border-bottom: 1px solid #e2e8f0;
            background: #2563eb;
            color: white;
            text-align: center;        */
        }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 10px 10%;

            display: flex;
            flex-direction: column;
        }

        .message {
            /* margin-bottom: 12px;
            padding: 10px 14px;
            border-radius: 10px;
            max-width: 70%; */
            
            margin: 10px 0;
            padding: 12px 18px;
            border-radius: 18px;
            line-height: 1.5;
            font-size: 15px;
            width: fit-content;
            max-width: 70%;
            word-wrap: break-word;    
            text-align: justify;  
        }

        .user-msg {
            /* background: #2563eb;
            color: white;
            margin-left: auto; */
            align-self: flex-end;
            background: #2563eb;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .bot-msg {
            /* background: white;
            border: 1px solid #e2e8f0; */
            
            background-color: #f1f5f9;

            color: #1e293b;

            border-bottom-left-radius: 4px;

            text-align: left;
        }

        .input-backgroud{
            padding: 20px 20%;
            background: white;

        }

        .input-area {
            /* display: flex;
            padding: 15px;
            border-top: 1px solid #e2e8f0;
            gap: 10px; */

            display: flex;
            align-items: center;
            background: #f4f4f4;
            border-radius: 25px;
            padding: 5px 20px;
            border: 1px solid #ddd;
        }

        input {
            /* flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #cbd5f5; */
            flex: 1;
            border: none;
            background: transparent;
            padding: 12px;
            outline: none;
            font-size: 16px;
        }

        button {
            /* padding: 10px 16px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer; */

            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;

        }

        
        .chat-btn {
            /* padding: 10px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 20px;
            width: 88px; */


            padding: 10px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;   /* override circle */
            cursor: pointer;
            margin-bottom: 20px;
            width: 88px;         /* optional: better width */

        }
    </style>
</head>

<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div>
            <div class="sidebar-header">
                <h2>Clinical Portal</h2>
            </div>
         
            
            <div class="sidebar-nav">

                
                <div class="sidebar-top">
                    <button class="chat-btn" onclick="startNewChat()">
                        <span class="icon">+</span> New chat
                    </button>
                </div>

                <div class="nav-item active" onclick="window.location.href='/therapist_index'">
                    <span>📊</span> Dashboard Overview
                </div>
    
                <div class="nav-item" onclick="window.location.href='/chat'">
                    <span>💬</span> AI Therapy Chat
                </div>
    
                <div class="nav-item" onclick="window.location.href='/therapist_history'">
                    📜 Chat History
                </div>
            </div>
    
        </div>
        <div class="sidebar-footer">
            <div style="margin-bottom: 15px;">
                <strong id="therapist-name" style="color: #334155;">Dr. Therapist</strong>
                <div style="font-size: 12px; color: #64748b;">Licensed Professional</div>
            </div>
            <button class="logout-btn" onclick="logout()">Log Out</button>
        </div>
    </aside>

    <!-- Chat -->
    <div class="main">

        <div class="header">
            <h1 id="title">Therapist AI Assistant</h1>
            <p style="color:white;">Clinical support powered by AI</p>
        </div>

        <div id="chat-box" class="chat-box"></div>

        <div class="input-backgroud">
            <div class="input-area">
                <input type="text" id="input" placeholder="Ask something..." />
                <!-- <button onclick="sendMessage()">Send</button> -->
                <button id="send-btn" onclick="sendMessage()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
                <div id="loading" class="loading">Thinking...</div>
        </div>

    </div>

    <script>
        const chatBox = document.getElementById("chat-box");
        const input = document.getElementById("input");
        const loadingIndicator = document.getElementById('loading');

        loadingIndicator.style.display = 'none';

        let sessionChat = JSON.parse(sessionStorage.getItem("therapist_chat")) || [];

        // Restore chat
        function restoreChat() {
            sessionChat.forEach(msg => {
                appendMessage(msg.sender, msg.text, false);
            });
        }

        // Append message
        function appendMessage(sender, text, save = true) {
            if (!text) text = "⚠️ Empty response";

            const div = document.createElement("div");
            div.className = sender === "User" ? "message user-msg" : "message bot-msg";
            div.innerText = text;

            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;

            if (save) {
                sessionChat.push({ sender, text });
                sessionStorage.setItem("therapist_chat", JSON.stringify(sessionChat));
            }
        }

        

        // Send message
        async function sendMessage() {
            const text = input.value.trim();
            if (!text) return;

            appendMessage("User", text);
            input.value = "";

            loadingIndicator.style.display = 'block';
            const userId = localStorage.getItem("user_id");

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        user_id: parseInt(userId),
                        message_text: text
                    })
                });

                const data = await response.json();

                console.log("DEBUG:", data);

                appendMessage("Bot", data.message_text);

            } catch (err) {
                appendMessage("Bot", "Error connecting to AI.");
            }finally {
                loadingIndicator.style.display = 'none';
            }
        }

        function startNewChat() {
            // Clear the temporary memory and reload the page
            sessionStorage.removeItem('therapist_chat');
            window.location.reload();
            // window.location.href = "/chat";
        }

        // Logout
        function logout() {
            localStorage.clear();
            window.location.href = "/login";
        }

        // Enter key
        input.addEventListener("keypress", e => {
            if (e.key === "Enter") sendMessage();
        });

        // Guard
        window.onload = () => {
            const role = localStorage.getItem("role");

            if (role !== "Professional") {
                window.location.href = "/";
                return;
            }

            const username = localStorage.getItem("username");
            if (username) {
                document.getElementById("title").innerText = `Dr. ${username} - AI Assistant`;
            }

            restoreChat();
        };
        window.addEventListener('DOMContentLoaded', () => {
                const role = localStorage.getItem("role");
                const username = localStorage.getItem("username");

                if (!role) {
                    window.location.href = "/login";
                    return;
                }

                if (role !== "Professional") {
                    alert("Unauthorized access. This area is for mental health professionals only.");
                    window.location.href = "/";
                    return;
                }

                // Set Therapist Name
                if (username) {
                    document.getElementById("therapist-name").innerText = `Dr. ${username}`;
                    document.getElementById("welcome-message").innerText = `Welcome back, Dr. ${username}`;
                }

                loadPatients();
            });
    </script>

</body>

</html>
