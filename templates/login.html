<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Therapy Assistant</title>
    <link rel="stylesheet" href="/static/index.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        .auth-container {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
        }

        .auth-card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .auth-card h2 {
            margin-bottom: 8px;
            color: #1e293b;
        }

        .auth-card p {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 6px;
        }

        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            box-sizing: border-box;
        }

        .password-wrapper input {
            padding-right: 40px;
        }

        .form-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1);
        }

        .eye-btn {
            position: absolute;
            right: 12px;
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            outline: none;
        }

        .eye-icon {
            width: 20px;
            height: 20px;
            color: #94a3b8;
            transition: color 0.2s ease;
        }

        .eye-btn:hover .eye-icon {
            color: #2563eb;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .toggle-link {
            margin-top: 20px;
            font-size: 14px;
            color: #64748b;
        }

        .toggle-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .toggle-link a:hover {
            text-decoration: underline;
        }

       
        .toast {
            position: relative;
           
            margin-bottom: 24px;
           
            color: white;
            padding: 16px 24px;
            border-radius: 8px;
          
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            display: none;
    
            align-items: center;
            gap: 12px;
            font-weight: 500;
            z-index: 1000;
      
            text-align: left;
         
            transform: none;
            transition: none;
        }

        .toast.show {
            display: flex;
 
        }

      
        .toast-success {
            background-color: #10b981;
        }

       
        .toast-info {
            background-color: #3b82f6;
        }

        .toast-error {
            background-color: #ef4444;
        }

      

        .toast-check-icon {
            width: 24px;
            height: 24px;
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <h2 id="auth-title">Welcome Back</h2>
            <p id="auth-subtitle">Log in to your therapy dashboard</p>

            <div id="toast" class="toast">
                <svg class="toast-check-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span id="toast-message">Success!</span>
            </div>

            <div class="form-group" id="username-group" style="display: none;">
                <label>Username</label>
                <input type="text" id="username" placeholder="Your name" required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="test1@test.com" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="••••••••" required>
                    <button type="button" class="eye-btn" onclick="toggleVisibility('password', this)" tabindex="-1">
                        <svg class="eye-icon eye-open" xmlns="http://www.w3.org/2000/svg" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                        <svg class="eye-icon eye-closed" style="display: none;" xmlns="http://www.w3.org/2000/svg"
                            fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                        </svg>
                    </button>
                </div>
            </div>

            <div class="form-group" id="confirm-group" style="display: none;">
                <label>Confirm Password</label>
                <div class="password-wrapper">
                    <input type="password" id="confirm-password" placeholder="••••••••" required>
                    <button type="button" class="eye-btn" onclick="toggleVisibility('confirm-password', this)"
                        tabindex="-1">
                        <svg class="eye-icon eye-open" xmlns="http://www.w3.org/2000/svg" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                        <svg class="eye-icon eye-closed" style="display: none;" xmlns="http://www.w3.org/2000/svg"
                            fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                        </svg>
                    </button>
                </div>
            </div>

            <button class="login-btn" id="submit-btn" onclick="handleSubmit()">Log In</button>

            <div class="toggle-link">
                <span id="toggle-text">Don't have an account?</span>
                <a href="#" onclick="toggleAuth(event)" id="toggle-action">Sign Up</a>
            </div>
        </div>
    </div>

    <script>
        let isLoginMode = true;

        
        function showToast(message, type = "success") {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');

            
            toast.classList.remove('toast-success', 'toast-info', 'toast-error');

           
            if (type === "error") {
                toast.classList.add('toast-error'); 
            } else if (type === "info") {
                toast.classList.add('toast-info'); 
            } else {
                toast.classList.add('toast-success'); 
            }

            toastMessage.innerText = message;
            toast.classList.add('show');

           
            if (type === "error" || type === "info") {
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 3000);
            }
        }

        function toggleVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            const eyeOpen = btn.querySelector('.eye-open');
            const eyeClosed = btn.querySelector('.eye-closed');

            if (input.type === 'password') {
                input.type = 'text';
                eyeOpen.style.display = 'none';
                eyeClosed.style.display = 'block';
            } else {
                input.type = 'password';
                eyeOpen.style.display = 'block';
                eyeClosed.style.display = 'none';
            }
        }

        function toggleAuth(event) {
            event.preventDefault();
            isLoginMode = !isLoginMode;

            const title = document.getElementById('auth-title');
            const subtitle = document.getElementById('auth-subtitle');
            const submitBtn = document.getElementById('submit-btn');
            const toggleText = document.getElementById('toggle-text');
            const toggleAction = document.getElementById('toggle-action');

            const usernameGroup = document.getElementById('username-group');
            const confirmGroup = document.getElementById('confirm-group');

            if (isLoginMode) {
                title.innerText = "Welcome Back";
                subtitle.innerText = "Log in to your therapy dashboard";
                submitBtn.innerText = "Log In";
                toggleText.innerText = "Don't have an account?";
                toggleAction.innerText = "Sign Up";
                usernameGroup.style.display = "none";
                confirmGroup.style.display = "none";
            } else {
                title.innerText = "Create Account";
                subtitle.innerText = "Join our Malaysia therapy network";
                submitBtn.innerText = "Sign Up";
                toggleText.innerText = "Already have an account?";
                toggleAction.innerText = "Log In";
                usernameGroup.style.display = "block";
                confirmGroup.style.display = "block";
            }
        }

        async function handleSubmit() {
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                const endpoint = isLoginMode ? '/login' : '/register';

                if (!email || !password) {
                    showToast("Please fill in all required fields.", "info");
                    return;
                }

                const payload = { email, password };

                if (!isLoginMode) {
                    const username = document.getElementById('username').value.trim();
                    const confirmPw = document.getElementById('confirm-password').value;

                    if (!username || !confirmPw) {
                        showToast("Please fill in all required fields.", "info");
                        return;
                    }

                    if (password !== confirmPw) {
                        showToast("Passwords do not match!", "info");
                        return;
                    }
                    payload.username = username;
                }

                try {
                    const response = await fetch(endpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (response.ok) {
                        const data = await response.json();

                        if (isLoginMode) {
                            localStorage.setItem('user_id', data.user_id || data.id);
                            localStorage.setItem('username', data.username);
                            localStorage.setItem('role', data.role);

                            showToast("Login Successful! Welcome back.", "success");

                            setTimeout(() => {
                                // --- UPDATED REDIRECT LOGIC ---
                                if (data.role === "Professional") {
                                    // Direct therapists to the new specialized index
                                    window.location.href = '/therapist_index';
                                } else {
                                    // Direct patients to the standard chat index
                                    window.location.href = '/';
                                }
                            }, 1500);

                        } else {
                            showToast("Account Created Successfully! Please log in.", "success");
                            setTimeout(() => {
                                window.location.reload();
                            }, 1500);
                        }

                    } else {
                        const errorData = await response.json();
                        showToast(errorData.detail || "Invalid email or password.", "info");
                    }
                } catch (err) {
                    console.error(err);
                    showToast("Server connection failed.", "error");
                }
            }
    </script>
</body>

</html>
