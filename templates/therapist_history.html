<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Therapist Chat History</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            display: flex;
            height: 100vh;
            background: white;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 260px;
            background: white;
            border-right: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .sidebar-header {
            padding: 24px;
            border-bottom: 1px solid #e2e8f0;
        }

        .sidebar-header h2 {
            margin: 0;
            color: #2563eb;
            font-size: 20px;
        }

        .sidebar-nav {
            padding: 20px 12px;
            flex-grow: 1;
        }

        .nav-item {
            padding: 12px 16px;
            margin-bottom: 8px;
            border-radius: 8px;
            color: #475569;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none; /* In case you use <a> tags */
        }

        .nav-item:hover {
            background: #f8fafc;
            color: #2563eb;
        }

        .nav-item span {
            font-size: 18px;
        }
        .sidebar-footer {
            padding: 20px;
            border-top: 1px solid #e2e8f0;
        }

        .logout-btn {
            width: 100%;
            padding: 10px;
            background: white;
            border: 1px solid #ef4444;
            color: #ef4444;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .logout-btn:hover {
            background: #fef2f2;
        }
        /* Main */
        .main {
            flex: 1;
            /* padding: 30px; */
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #2563eb;
            color: white;
            padding: 4px;
            text-align: center;
        }

        /* Chat UI */
        .chat-container {
            /* display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px; */
            
            flex: 1;
            overflow-y: auto;
            padding: 10px 10%;

            display: flex;
            flex-direction: column;
        }

        .message {
            margin: 10px 0;
            padding: 12px 18px;
            border-radius: 18px;
            line-height: 1.5;
            font-size: 15px;
            width: fit-content;
            max-width: 70%;
            word-wrap: break-word;    
            text-align: justify;                                    
        }

        /* User (Right) */
        .user-msg {
            align-self: flex-end;
            background: #2563eb;
            color: white;
            border-bottom-right-radius: 4px;
        }

        /* Bot (Left) */
        .bot-msg {
            background-color: #f1f5f9;

            color: #1e293b;
            align-self: flex-start;

            border-bottom-left-radius: 4px;

            text-align: left;
            
            /* border: 1px solid #e2e8f0; */
        }

        /* Timestamp */
        .timestamp {
            font-size: 11px;
            margin-top: 6px;
            opacity: 0.6;
        }

        /* Crisis Highlight */
        .crisis {
            border: 2px solid #ef4444;
            background: #fef2f2;
        }

        
        .chat-btn {
            padding: 10px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 20px;
            width: 88px; 
        }


    </style>
</head>

<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div>
            <div class="sidebar-header">
                <h2>Clinical Portal</h2>
            </div>
            <div class="sidebar-nav">
            
                <div class="sidebar-top">
                    <button class="chat-btn" onclick="startNewChat()">
                        <span class="icon">+</span> New chat
                    </button>
                </div>
                <div class="nav-item active" onclick="window.location.href='/therapist_index'">
                    <span>📊</span> Dashboard Overview
                </div>
    
                <div class="nav-item" onclick="window.location.href='/chat'">
                    <span>💬</span> AI Therapy Chat
                </div>
    
                <div class="nav-item" onclick="window.location.href='/therapist_history'">
                    📜 Chat History
                </div>
            </div>
    
        </div>
        <div class="sidebar-footer">
            <div style="margin-bottom: 15px;">
                <strong id="therapist-name" style="color: #334155;">Dr. Therapist</strong>
                <div style="font-size: 12px; color: #64748b;">Licensed Professional</div>
            </div>
            <button class="logout-btn" onclick="logout()">Log Out</button>
        </div>
    </aside>

    <!-- Main -->
    <div class="main">
        <div class="header">
            <h1 id="title">Chat History</h1>
            <p style="color:white;">Review past AI conversations</p>
        </div>

        <div id="chat-list" class="chat-container">
            <p>Loading history...</p>
        </div>
    </div>

    <script>

        window.addEventListener('DOMContentLoaded', () => {
                const role = localStorage.getItem("role");
                const username = localStorage.getItem("username");

                if (!role) {
                    window.location.href = "/login";
                    return;
                }

                if (role !== "Professional") {
                    alert("Unauthorized access. This area is for mental health professionals only.");
                    window.location.href = "/";
                    return;
                }

                // Set Therapist Name
                if (username) {
                    document.getElementById("therapist-name").innerText = `Dr. ${username}`;
                    document.getElementById("welcome-message").innerText = `Welcome back, Dr. ${username}`;
                }

                loadPatients();
            });
        async function loadHistory() {
            const userId = localStorage.getItem("user_id");

            if (!userId) {
                document.getElementById("chat-list").innerHTML = "<p>No user selected.</p>";
                return;
            }

            try {
                const response = await fetch(`/chat/${userId}`);
                const data = await response.json();

                const container = document.getElementById("chat-list");
                container.innerHTML = "";

                if (!data.length) {
                    container.innerHTML = "<p>No chat history found.</p>";
                    return;
                }

                data.forEach(msg => {
                    const wrapper = document.createElement("div");

                    let className = "message " + (msg.sender === "User" ? "user-msg" : "bot-msg");

                    // Crisis highlight (optional detection)
                    if (msg.message_text.toLowerCase().includes("talian heal") ||
                        msg.message_text.toLowerCase().includes("befrienders")) {
                        className += " crisis";
                    }

                    wrapper.className = className;

                    wrapper.innerHTML = `
                        <div>${msg.message_text}</div>
                        <div class="timestamp">
                            ${msg.timestamp ? new Date(msg.timestamp).toLocaleString() : ""}
                        </div>
                    `;

                    container.appendChild(wrapper);
                });

                // Auto scroll to bottom
                container.scrollTop = container.scrollHeight;

            } catch (err) {
                console.error(err);
                document.getElementById("chat-list").innerHTML = "<p style='color:red;'>Error loading history.</p>";
            }
        }

        function startNewChat() {
            // Clear the temporary memory and reload the page
            sessionStorage.removeItem('therapist_chat');
            // window.location.reload();
             window.location.href = "/chat";
        }

        function logout() {
            localStorage.clear();
            window.location.href = "/login";
        }

        // Guard + Load
        window.onload = () => {
            const role = localStorage.getItem("role");

            if (role !== "Professional") {
                window.location.href = "/";
                return;
            }

            const username = localStorage.getItem("username");
            if (username) {
                document.getElementById("title").innerText = `Dr. ${username} - Chat History`;
            }

            loadHistory();
        };
    </script>

</body>

</html>
